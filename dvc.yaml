# Pipeline DVC – reproduzível com `dvc repro`.
# Cada estágio declara dependências (deps) e saídas (outs) para que o DVC
# saiba o que reexecutar quando algo mudar.

stages:
  etl:
    cmd: uv run python -m src.data.pipeline
    deps:
      - src/data/pipeline.py
      - src/data/extract.py
      - src/data/transform.py
      - src/data/load.py
      - src/config.py
      - data/raw/training_sample.csv
    outs:
      - data/processed/customer_propensity.parquet

  train:
    cmd: uv run python -m src.training.baseline
    deps:
      - src/training/baseline.py
      - src/config.py
      - data/processed/customer_propensity.parquet
    outs:
      - models/baseline.pkl
    metrics:
      - models/metrics.json:
          cache: false
