# Deploy da API no Render (render.com), como Blueprint: New > Blueprint, apontando
# para este repositório. Usa o mesmo Dockerfile do pipeline, trocando o comando de
# start pela API. O Render informa a porta em PORT, que `python -m src.api` lê.
# Publica a branch escolhida ao criar o Blueprint (em produção, a `main`).
#
# Usuário e token do MLflow são secretos: não ficam aqui. O Render pede os valores
# no painel na criação do serviço (sync: false).

services:
  - type: web
    name: purchase-propensity-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: python -m src.api
    healthCheckPath: /health
    # Só publica depois que o CI do GitHub passa.
    autoDeployTrigger: checksPass
    envVars:
      - key: MLFLOW_TRACKING_URI
        value: https://dagshub.com/ThiagoZulian/purchase-propensity.mlflow
      - key: MLFLOW_TRACKING_USERNAME
        sync: false
      - key: MLFLOW_TRACKING_PASSWORD
        sync: false
