# Valida o título do PR com o mesmo padrão dos commits (commitizen, tipos no
# pyproject.toml). O título vira a mensagem do commit de merge, e o hook
# commit-msg local não passa por ele.

name: "Guard: PR title"

on:
  pull_request:
    types: [opened, reopened, edited, synchronize]
    branches: [main, develop]

permissions:
  contents: read

jobs:
  check-title:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.11.13"
          enable-cache: true

      - name: Validar título com commitizen
        env:
          # Via env, não interpolado no script: o título é texto livre de quem abre o PR.
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: uv run cz check --message "$PR_TITLE"
