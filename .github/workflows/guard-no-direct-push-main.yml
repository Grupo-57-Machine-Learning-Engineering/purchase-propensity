# Detector (não previne) de push direto na main. Como não há branch protection
# no plano da org, este workflow denuncia com run vermelho quando um commit entra
# na main FORA do fluxo de PR.
#
# O critério aceita PR mergeado para `main` ou para `develop`: uma release
# `develop -> main` arrasta junto commits que entraram na develop via PR com base
# `develop`. Commit empurrado na marra continua sendo pego, porque não tem PR
# mergeado nenhum associado.

name: "Guard: no direct push to main"

on:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar que todos os commits vieram de PR merged
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail

          ZERO="0000000000000000000000000000000000000000"

          # before = zero quando o push cria a branch (commit inicial do repo)
          if [ "$BEFORE" = "$ZERO" ]; then
            echo "Push criou a branch main (sem before). Pulando checagem de range."
            exit 0
          fi

          # compare em vez do payload do evento: payload trunca em ~20 commits
          commits=$(gh api "repos/${REPO}/compare/${BEFORE}...${AFTER}" --jq '.commits[].sha')

          if [ -z "$commits" ]; then
            echo "Nenhum commit novo no range, nada a checar."
            exit 0
          fi

          # AND entre commits, não OR: 1 commit sem PR já reprova o push inteiro
          FAILED=0
          for sha in $commits; do
            merged_prs=$(gh api "repos/${REPO}/commits/${sha}/pulls" \
              --jq '[.[] | select(.merged_at != null and (.base.ref == "main" or .base.ref == "develop"))] | length')

            if [ "$merged_prs" -eq 0 ]; then
              echo "::error::Commit $sha entrou em main sem PR merged associado (nem para main, nem para develop). Autor do push: @${ACTOR}."
              FAILED=1
            else
              echo "OK: commit $sha veio de PR merged."
            fi
          done

          if [ "$FAILED" -eq 1 ]; then
            echo "::error::Commit sem PR na main (push por @${ACTOR}). Fluxo esperado: branch -> PR -> develop -> PR -> main."
            exit 1
          fi
