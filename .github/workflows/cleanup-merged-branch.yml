# Apaga a branch de origem depois que o PR é mergeado. Não usamos a opção
# "Automatically delete head branches" do GitHub porque ela apagaria a develop
# no merge develop -> main (o plano free não tem branch protection para evitar).

name: "Cleanup: delete merged branch"

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  delete-branch:
    if: >-
      github.event.pull_request.merged &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref != 'develop' &&
      github.event.pull_request.head.ref != 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Apagar a branch mergeada
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          gh api -X DELETE "repos/${REPO}/git/refs/heads/${BRANCH}" \
            || echo "Branch ${BRANCH} já tinha sido apagada."
