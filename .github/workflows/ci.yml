# CI padrão do projeto: lint (ruff) + testes (pytest) via uv.
# Roda em push e PR para main/develop e valida o código em si.
# Os guards e a limpeza de branch são workflows separados: guard-no-direct-push-main.yml,
# guard-pr-base-develop.yml, guard-pr-title.yml e cleanup-merged-branch.yml.

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.11.13"
          enable-cache: true

      - name: Set up Python (versão do .python-version)
        run: uv python install

      # --locked falha se o uv.lock estiver desatualizado em relação ao pyproject
      - name: Install dependencies
        run: uv sync --locked

      - name: Lint (ruff)
        run: make lint

      - name: Test (pytest)
        run: make test
